plugins {
    id 'java-library'
    id "io.github.0ffz.github-packages" version "1.2.1" // Plugin for anonymous inclusion of artifacts hosted in github package registry
}

dependencies {
    api libs.jmeCore
    runtimeOnly libs.jmeJogg
    runtimeOnly libs.jmePlugins

    api libs.log4j.core
    api libs.log4j.api
    api libs.lemur
    api libs.lemur.proto

    implementation 'org.codehaus.groovy:groovy:3.0.21'
    implementation 'org.codehaus.groovy:groovy-jsr223:3.0.21'
    runtimeOnly 'org.slf4j:slf4j-simple:2.0.12'
}
